services:
  # NodeJS Service
  app-assurmoi-node:
    container_name: "app-assurmoi-API-nodejs1"
    build:
      context: ./
      dockerfile: Dockerfile
    command: 'npm run dev'
    depends_on:
       - 'app-assurmoi-db'
       - 'app-assurmoi-mailhog'
    links:
       - 'app-assurmoi-db:db'
       - 'app-assurmoi-mailhog:mailhog'
    environment:
      - NODE_ENV=development
      # Prioritaires sur le fichier .env monté : connexion DB depuis le conteneur
      - DB_HOST=app-assurmoi-db
      - DB_PORT=3306
      - DB_NAME=assurmoidb
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - DB_SSL=false
    volumes:
      - './api-annonces:/home/app/api-annonces:rw'
      # Préserver les dépendances installées dans l'image build (évite d'effacer `node_modules`)
      - 'api-annonces-node-modules:/home/app/api-annonces/node_modules'
    ports:
      - "3000:3000"
    networks:
      - default
    expose:
      - "3000"
    working_dir: '/home/app/api-annonces'

  # react native environment
  app-assurmoi-app:
    container_name: 'app-assurmoi-reactnative1'
    build:
      context: ./
      dockerfile: Dockerfile.front
    command: >
      sh -lc "if [ ! -f package.json ]; then
        echo 'Expo project not initialized in ./assurmobile (missing package.json).';
        echo 'Run: docker compose run --rm app-assurmoi-app npx create-expo-app .';
        tail -f /dev/null;
      else
        npm install && npx expo start --port 8081 --non-interactive --lan;
      fi"
    environment:
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    ports:
      - 8081:8081
      - 19000:19000
      - 19001:19001
      - 19002:19002
    volumes:
      - './assurmobile:/home/app:rw'
      # Préserver les dépendances installées dans l'image build (évite d'effacer `node_modules`)
      - 'assurmobile-node-modules:/home/app/node_modules'
    working_dir: '/home/app/'
    stdin_open: true
    tty: true
  # SMTP server
  app-assurmoi-mailhog:
    container_name: 'app-assurmoi-mailhog1'
    image: mailhog/mailhog
    ports: 
      - 1025:1025 # smtp server
      - 8025:8025 # web ui
  # database
  app-assurmoi-db:
    container_name: 'app-assurmoi-db1'
    image: mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: assurmoidb
    ports:
      # Permet migrations/seed depuis Windows (127.0.0.1) en plus du réseau Docker
      - "3306:3306"
    volumes:
      - './db-data:/var/lib/mysql:rw'
  # Database client
  app-assurmoi-adminer:
    container_name: 'app-assurmoi-adminer1'
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  api-annonces-node-modules:
  assurmobile-node-modules:
